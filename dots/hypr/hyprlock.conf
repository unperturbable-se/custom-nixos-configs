general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(14, 14, 20, 1.0)
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(230, 230, 240, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(160, 160, 180, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(51, 204, 255, 1.0)
    inner_color = rgba(30, 30, 46, 1.0)
    font_color = rgba(230, 230, 240, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    position = 0, -20
    halign = center
    valign = center
}
