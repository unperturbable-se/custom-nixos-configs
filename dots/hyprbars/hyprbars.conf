# hyprbars settings (title bars)
# The plugin itself is loaded from hyprland.conf with:
#   exec-once = hyprctl plugin load /run/current-system/sw/lib/libhyprbars.so

plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(1e1e2eee)
        col.text = rgba(cdd6f4ff)
        bar_text_size = 10
        bar_text_font = JetBrainsMono Nerd Font
        bar_padding = 12
        bar_button_padding = 10
        bar_precedence_over_border = true

        # buttons show only their color until you hover them
        icon_on_hover = true
        inactive_button_color = rgba(45475aff)

        # color, size, icon, command
        hyprbars-button = rgb(f38ba8), 12, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(a6e3a1), 12, , hyprctl dispatch fullscreen 1
    }
}

# No hyprbars bar on Firefox (it already draws its own title bar).
# If hyprctl configerrors rejects this line, use the older form instead:
#   windowrulev2 = plugin:hyprbars:nobar, class:^(firefox)$
windowrule = plugin:hyprbars:nobar on, match:float false
